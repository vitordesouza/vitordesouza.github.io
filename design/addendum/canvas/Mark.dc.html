<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Personal mark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<svg viewBox="0 0 100 100" width="{{size}}" height="{{size}}" aria-hidden="true" style="display: block; overflow: visible">
<sc-if value="{{isCurrent}}" hint-placeholder-val="{{ false }}">
<g transform="scale(1.5625)"><rect width="64" height="64" rx="14" fill="{{bg}}"></rect><path fill="{{ink}}" d="M8 15h9l10 27 10-27h9L31 51h-8Z"></path><circle cx="52" cy="47" r="5" fill="{{accent}}"></circle></g>
</sc-if>
<sc-if value="{{isDot}}" hint-placeholder-val="{{ false }}">
<g transform="translate(4 86) scale(0.1)"><path fill="{{ink}}" d="M287.5 0 L15.5 -706 H184 L391 -135 H322 L531.5 -706 H697.5 L422.5 0 Z"></path></g>
<circle cx="86" cy="78" r="8.5" fill="{{accent}}"></circle>
</sc-if>
<sc-if value="{{isSigned}}" hint-placeholder-val="{{ false }}">
<g transform="translate(14 74) scale(0.1)"><path fill="{{ink}}" d="M287.5 0 L15.5 -706 H184 L391 -135 H322 L531.5 -706 H697.5 L422.5 0 Z"></path></g>
<path d="M8 88 C 30 80, 52 82, 62 86 S 84 92, 94 80" fill="none" stroke="{{accent}}" stroke-width="7" stroke-linecap="round"></path>
</sc-if>
<sc-if value="{{isStatus}}" hint-placeholder-val="{{ true }}">
<circle cx="50" cy="50" r="46" fill="{{ink}}"></circle>
<g transform="translate(23.3 78) scale(0.075)"><path fill="{{bg}}" d="M287.5 0 L15.5 -706 H184 L391 -135 H322 L531.5 -706 H697.5 L422.5 0 Z"></path></g>
<circle cx="83" cy="83" r="11" fill="{{accent}}" stroke="{{bg}}" stroke-width="5"></circle>
</sc-if>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"concept":{"editor":"enum","options":["current","dot","signed","status"],"default":"status"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"size":{"editor":"int","default":100},"$preview":{"width":100,"height":100}}'>
class Component extends DCLogic {
  renderVals() {
    const concept = this.props.concept ?? 'status';
    const dark = (this.props.theme ?? 'light') === 'dark';
    return {
      size: this.props.size ?? 100,
      ink: dark ? '#EDECE6' : '#111111',
      bg: dark ? '#11110F' : '#F3F2EE',
      accent: dark ? '#3FAE7F' : '#1E7A55',
      isCurrent: concept === 'current',
      isDot: concept === 'dot',
      isSigned: concept === 'signed',
      isStatus: concept === 'status'
    };
  }
}
</script>
</body>
</html>
